# ==============================================================================
# AyuRAG-XAI Production Nginx Reverse Proxy Configuration
# Handles SPA static serving, caching, security headers, and API proxying
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format clinical '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" $request_time';

    access_log /var/log/nginx/access.log clinical;
    error_log /var/log/nginx/error.log warn;

    # Optimization
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    upstream django_backend {
        server web:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost _;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Frontend SPA Root
        root /usr/share/nginx/html;
        index index.html;

        # Frontend Client-Side Routing Fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache Static Assets (Vite hashes file names)
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Django Admin
        location /admin/ {
            proxy_pass http://django_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90;
        }

        # Django REST API
        location /api/ {
            proxy_pass http://django_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90;
        }

        # Django Collected Static Files
        location /django-static/ {
            alias /var/www/django-static/;
            expires 30d;
            add_header Cache-Control "public";
        }

        # Health Probe Direct Pass-Through
        location /health/ {
            proxy_pass http://django_backend/api/health/live/;
            proxy_set_header Host $http_host;
        }
    }
}
