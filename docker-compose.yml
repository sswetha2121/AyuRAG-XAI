# ==============================================================================
# AyuRAG-XAI Production Orchestration (Docker Compose)
# ==============================================================================

version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ayurag_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-ayurag_production}
      POSTGRES_USER: ${DB_USER:-ayurag_app_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ayurag_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ayurag_app_user} -d ${DB_NAME:-ayurag_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ayurag_internal

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ayurag_backend
    restart: always
    environment:
      DJANGO_ENV: ${DJANGO_ENV:-production}
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-replace-with-long-random-production-secret-key-at-least-50-chars}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-False}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-False}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-ayurag_production}
      DB_USER: ${DB_USER:-ayurag_app_user}
      DB_PASSWORD: ${DB_PASSWORD:-ayurag_secure_password_2026}
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - django_static:/app/staticfiles
      - django_media:/app/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ayurag_internal

  frontend:
    image: nginx:alpine
    container_name: ayurag_frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - django_static:/var/www/django-static:ro
    depends_on:
      - web
    networks:
      - ayurag_internal

networks:
  ayurag_internal:
    driver: bridge

volumes:
  postgres_data:
  django_static:
  django_media:
