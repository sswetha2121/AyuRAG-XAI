name: AyuRAG-XAI Release Verification Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend-checks:
    name: Frontend Verification & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Production Frontend Bundle
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          test -d dist/assets || { echo "dist/assets missing"; exit 1; }

  backend-checks:
    name: Backend System Checks & Automated Tests
    runs-on: ubuntu-latest
    env:
      DJANGO_ENV: test
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "ci-testing-secret-key-not-for-production-use-minimum-50-chars-long"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DEMO_MODE: "False"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Django System Checks
        working-directory: ./backend
        run: python manage.py check

      - name: Django Production Deployment Check
        working-directory: ./backend
        env:
          DJANGO_ENV: production
          DJANGO_SECURE_SSL_REDIRECT: "True"
        run: python manage.py check --deploy

      - name: Verify Migration Consistency
        working-directory: ./backend
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --check

      - name: Run Backend Test Suite
        working-directory: ./backend
        run: python manage.py test --verbosity=2

      - name: Verify Database Integrity & Backup Utility
        working-directory: ./backend
        run: |
          python scripts/db_backup_restore.py verify
          python scripts/db_backup_restore.py backup --output-dir /tmp/ci_backup
